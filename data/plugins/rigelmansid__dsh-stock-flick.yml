description:
  en: 'A-share market workspace for DeepSeek Harness: 31 Shenwan level-1 sectors, 131 industries and 5,581 stocks in nested treemaps sized by float cap, total cap or turnover, with 1/3/5-day intraday and daily/weekly/monthly charts, a rule-based trend readout, a watchlist, a trade ledger with realized P&L and a daily P&L curve, price and percent alerts, and JSON export.'
  zh: 'DeepSeek Harness 的 A 股工作台：31 个申万一级行业、131 个二级行业与 5581 只个股的嵌套云图，面积按流通市值、总市值或成交额切换；1/3/5 日分时与日周月 K 线、规则化趋势研判、自选、可编辑交易流水与已实现盈亏、按日收益曲线、价格与涨跌幅预警，以及 JSON 导出。'
